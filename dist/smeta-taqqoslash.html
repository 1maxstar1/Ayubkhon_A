<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смета — Таблица сопоставления №2</title>
<style>/* Palette follows the reference workbook (321.xlsx): light-blue band D9E2F3,
   cyan CCFFFF header cells, pink FFC7CE / 9C0006 "bad" cells, and the Excel
   "good" pair C6EFCE / 006100 for finished / positive actions. Navy 16305C is
   the ink for everything in the top bar. */
:root{
  --bg:#eef0f4; --sf:#fff; --sf2:#f7f8fa; --ink:#14171c; --mute:#6a7280;
  --rule:#dfe3ea; --rule2:#c7ccd6; --accent:#1f5fbf; --accent-w:#e8f0fd;
  --navy:#16305c; --navy2:#204378; --band:#d9e2f3; --band2:#aabdde;
  --cyan:#ccffff; --cyan2:#6fc2c2; --pink:#ffc7ce; --pink2:#d2848d; --pinktx:#9c0006;
  --green:#c6efce; --green2:#6db383; --greentx:#006100;
  --good:#116b3c; --bad:#b3261e;
  --row:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* .btn sets display, so the attribute needs priority */
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums;overflow:hidden;
  display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------------------------------------------------------------- buttons */
/* One system for every clickable thing: same height, solid fill, navy ink.
   Variants: primary (navy), cyan (add / open), ok (finish / continue),
   danger (delete / clear). Works on <button>, <a> and <label> alike. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;
  border:1px solid var(--navy);border-radius:7px;background:#fff;color:var(--navy);font-weight:600;
  cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1;
  box-shadow:0 1px 0 rgba(22,48,92,.18);transition:background .12s,transform .05s}
.btn:hover:not(:disabled){background:#e9effa}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover:not(:disabled){background:var(--navy2)}
.btn.cyan{background:var(--cyan);border-color:var(--cyan2);color:var(--navy)}
.btn.cyan:hover:not(:disabled){background:#b3f5f5}
.btn.ok{background:var(--green);border-color:var(--green2);color:var(--greentx)}
.btn.ok:hover:not(:disabled){background:#b2e8bd}
.btn.danger{background:var(--pink);border-color:var(--pink2);color:var(--pinktx)}
.btn.danger:hover:not(:disabled){background:#ffb0ba}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn.xs{height:23px;padding:0 7px;font-size:11px;border-radius:5px;box-shadow:none}
.btn.wide{width:100%;height:38px;margin-top:6px}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.btn .ic{font-size:15px;line-height:1;font-weight:700}
.link{border:0;background:none;color:var(--mute);cursor:pointer;padding:2px 6px;border-radius:4px}
.link:hover{background:var(--sf2);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------------------------------------------------------------- top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;
  background:var(--band);border-bottom:2px solid var(--band2);flex:none}
.brand{flex:0 0 auto;white-space:nowrap;color:var(--navy)}
.brand b{font-size:15px;font-weight:700;letter-spacing:.01em}
.brand span{display:block;font-size:11px;color:#3d5583;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.grow{flex:1}
.pickmode{display:flex;align-items:center;gap:6px;height:34px;border:1px solid var(--navy);border-radius:7px;
  padding:0 4px 0 10px;background:#fff;box-shadow:0 1px 0 rgba(22,48,92,.18)}
.pickmode span{font-size:11px;color:var(--navy);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pickmode select{border:0;background:none;padding:4px 2px;cursor:pointer;max-width:250px;color:var(--navy);font-weight:600}
.userbox{display:flex;align-items:center;gap:6px;font-size:12px;margin-left:4px;padding-left:12px;border-left:1px solid var(--band2)}
.userbox .who{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--navy);margin-right:4px}
.userbox .av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--navy);color:#fff;font-size:12px;font-weight:700}
.wsbox{display:flex;align-items:center;gap:8px;font-size:12px;flex:0 1 auto;min-width:90px}
.wsbox .no{background:var(--navy);color:#fff;border-radius:6px;padding:3px 8px;font-weight:700;white-space:nowrap}
.wsbox .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--navy);max-width:280px}
.wsbox .rg{font-size:11px;background:#fff;color:var(--navy);border:1px solid var(--band2);border-radius:5px;padding:2px 7px;white-space:nowrap;font-weight:600}
.wsbox .sv{color:var(--navy);width:16px;text-align:center;font-weight:700}
.wsbox .done{font-size:11px;background:var(--green);color:var(--greentx);border:1px solid var(--green2);border-radius:5px;padding:2px 7px;font-weight:700}
/* With a workspace open the bar is crowded: drop the strapline. */
body.ws .brand span{display:none}
body.nows .bar > .btn,body.nows .bar > .pickmode{display:none}

/* ---------------------------------------------------------------- ledger */
.ledger{padding:9px 14px;background:var(--sf);border-bottom:1px solid var(--rule);font-size:12px;min-height:38px;display:flex;gap:26px;align-items:baseline;flex-wrap:wrap;flex:none}
.ledger .k{color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:10px;display:block}
.ledger .v{font-size:16px;font-weight:600}
.ledger .v.good{color:var(--good)} .ledger .v.bad{color:var(--bad)}
.ledger .empty{color:var(--mute)}

/* ------------------------------------------------------------------ shell */
main{display:grid;grid-template-columns:288px 1fr;flex:1;min-height:0}
main.narrow{grid-template-columns:0 1fr}
main.narrow aside{display:none}
aside{background:var(--sf);border-right:1px solid var(--rule);overflow:auto;display:flex;flex-direction:column}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:11px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--mute);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sf);z-index:2}
.projects{padding:6px}
.proj{border:1px solid var(--rule);border-radius:8px;margin-bottom:8px;overflow:hidden}
.proj > header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--sf2);border-bottom:1px solid var(--rule)}
.proj header input.tab-name{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:4px;padding:3px 5px;font-weight:600}
.proj header input.tab-name:hover{border-color:var(--rule2);background:#fff}
.proj .meta{padding:5px 9px;font-size:11px;color:var(--mute);border-bottom:1px solid var(--rule)}
.proj .meta textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:4px 6px;resize:vertical;font-size:11px;color:var(--ink);margin-top:4px}
.objs{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.objs li{display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:12px;border-top:1px solid #f0f2f5}
.objs li:hover{background:var(--accent-w)}
.objs li span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objs li small{color:var(--mute);font-size:10px}
.objs li.off span.nm{opacity:.45;text-decoration:line-through}
.objs li .mv{visibility:hidden;border:0;background:none;cursor:pointer;color:var(--mute);padding:0 2px;line-height:1}
.objs li:hover .mv{visibility:visible}
.drop-hint{margin:auto;padding:22px;text-align:center;color:var(--mute);font-size:12px}
.drop-hint b{display:block;margin-bottom:5px;color:var(--ink)}
body.drag::after{content:"";position:fixed;inset:8px;border:2px dashed var(--accent);border-radius:10px;background:rgba(31,95,191,.06);pointer-events:none;z-index:60}

/* ------------------------------------------------------------------ panes */
#work{display:flex;flex-direction:column;min-width:0;background:var(--sf)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--rule);background:var(--sf2)}
.tab{border:1px solid transparent;border-bottom:0;background:none;padding:6px 14px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--mute);font-weight:600}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--sf);border-color:var(--rule);border-top:3px solid var(--navy);color:var(--navy);margin-bottom:-1px;padding-bottom:7px}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
.toolbar input[type=search],.toolbar select,.toolbar input[type=text]{border:1px solid var(--rule2);border-radius:6px;padding:5px 8px;background:var(--sf)}
.toolbar input[type=search]{min-width:230px}
.count{color:var(--mute);font-size:12px;white-space:nowrap}
.count.where{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;min-width:0}
#jump{flex:0 1 340px;min-width:150px}
.count.where b{color:var(--ink);font-weight:600}
.rng{font-size:10px;color:var(--accent);background:var(--accent-w);border-radius:3px;padding:0 4px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.objs li .rng{margin-left:auto}
.proj header .rng{margin-left:2px}
.proj > header .link{padding:2px 3px;font-size:11px}

/* ------------------------------------------------------------ data tables */
.thead,.vrow{display:flex;align-items:stretch}
.thead{border-bottom:1px solid var(--rule2);background:var(--cyan);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;z-index:3}
.thead .c{padding:6px 7px;border-right:1px solid #b9dede;display:flex;align-items:center}
.vscroll{flex:1;overflow:auto;position:relative;contain:strict}
.vspace{position:relative;width:100%}
.vbody{position:absolute;left:0;right:0;top:0;will-change:transform}
.vrow{height:var(--row);border-bottom:1px solid #eef0f3;font-size:12px}
.vrow:hover{background:var(--accent-w)}
.vrow .c{padding:0 7px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;border-right:1px solid #f2f4f7}
.vrow .c.num{justify-content:flex-end;font-variant-numeric:tabular-nums}
.vrow .c.mid{justify-content:center}
.vrow .c.idx,.thead .c.idx{color:var(--mute);background:#fafbfd;font-size:11px}
.vrow.k-title .c.idx,.vrow.k-object .c.idx,.vrow.k-section .c.idx,.vrow.k-total .c.idx,
.vrow.k-header .c.idx,.vrow.k-numbering .c.idx{background:transparent}
.vrow.k-section,.vrow.k-total,.vrow.k-grandtotal,.vrow.k-header,.vrow.k-numbering,.vrow.k-uzhead,.vrow.k-uznum{background:var(--cyan);font-weight:600}
.vrow.k-title,.vrow.k-object,.vrow.k-intro,.vrow.k-bigtitle{background:#fbfbfd;font-weight:600}
.vrow.k-blank{background:#fff}
.vrow.chg{background:#fff6f7}
.vrow.chg:hover{background:#ffeef0}
.vrow .c.diff{color:var(--pinktx);font-weight:600}
.vrow .c.big{background:var(--pink);color:var(--pinktx)}
.pin{width:100%;border:1px solid transparent;background:none;border-radius:4px;padding:2px 5px;text-align:right;
  font-variant-numeric:tabular-nums;min-width:0}
.pin:hover{border-color:var(--rule2);background:#fff}
.pin:focus{border-color:var(--accent);background:#fff;outline:none}
.pin.edited{background:#fff7e6;font-weight:600}
.tagm{display:inline-block;background:#fde7c7;color:#8a5300;border:0;border-radius:3px;padding:1px 5px;
  font-size:10px;margin-left:6px;cursor:pointer;font-family:inherit}
.tagm:hover{background:#f8d49b}

/* ------------------------------------------------------------------ forms */
.form{padding:16px 18px;overflow:auto;max-width:720px}
.form h3{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.form h3:first-child{margin-top:0}
.form label{display:block;margin-bottom:10px;font-size:12px;color:var(--mute)}
.form label.row{display:flex;gap:7px;align-items:center;color:var(--ink);font-size:13px}
.form input[type=text],.form input[type=number],.form textarea{
  display:block;width:100%;margin-top:4px;border:1px solid var(--rule2);border-radius:6px;padding:6px 8px;color:var(--ink);resize:vertical}
.form .note{color:var(--mute);font-size:12px;margin-top:18px}

/* --------------------------------------------------------------- overlays */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#14171c;color:#fff;
  padding:9px 16px;border-radius:7px;opacity:0;pointer-events:none;transition:.18s;z-index:80;max-width:70vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#7d1b16}
.busy{position:fixed;inset:0;background:rgba(238,240,244,.72);display:none;align-items:center;justify-content:center;
  gap:12px;z-index:90;backdrop-filter:blur(1px)}
.busy.on{display:flex}
.spin{width:20px;height:20px;border:2.5px solid var(--rule2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------------------------------------------------------------- screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.screen[hidden]{display:none}
.card{background:var(--sf);border:1px solid var(--rule);border-radius:12px;padding:28px 30px;width:100%;max-width:420px;box-shadow:0 8px 30px rgba(20,23,28,.08);border-top:4px solid var(--navy)}
.card h2{margin:0 0 6px;font-size:18px;color:var(--navy)}
.card .lead{color:var(--mute);margin:0 0 18px;font-size:12.5px}
.card label{display:block;font-size:12px;color:var(--mute);margin-bottom:12px}
.card input,.card select{display:block;width:100%;margin-top:4px;border:1px solid var(--rule2);border-radius:6px;padding:8px 10px;font-size:14px;color:var(--ink);background:#fff}
.card .hint{font-size:11.5px;color:var(--mute);margin:-4px 0 12px}
.card .err{color:var(--bad);font-size:12px;margin:0 0 10px}
.card .foot{color:var(--mute);font-size:11px;margin:14px 0 0}

/* ------------------------------------------------------------------ admin */
body.admin{overflow:auto}
main.admin-main{display:block;flex:none;height:auto;width:100%;max-width:1040px;margin:0 auto;padding:18px 16px 40px}
.admin-main[hidden]{display:none}
.panel{background:var(--sf);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:16px;border-top:4px solid var(--band2)}
.panel h2{margin:0 0 6px;font-size:15px;color:var(--navy)}
.panel h3{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.panel .lead{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.panel .err{color:var(--bad);font-size:12px}
.panel .stat{font-size:13px;margin-top:8px;font-weight:600}
.panel .mute{color:var(--mute);font-weight:400}
.progress{position:relative;height:22px;border:1px solid var(--rule2);border-radius:6px;margin-top:10px;overflow:hidden;background:var(--sf2)}
.progress .bar-fill{position:absolute;inset:0 auto 0 0;background:var(--band);transition:width .2s}
.progress span{position:relative;line-height:22px;padding-left:8px;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);font-weight:700;background:var(--cyan)}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl td.act .btn{margin-left:4px}
form.inline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
form.inline input,form.inline select{border:1px solid var(--rule2);border-radius:6px;padding:0 8px;height:34px;background:var(--sf)}
form.inline input{flex:1;min-width:160px}
form.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;margin-bottom:10px}
form.grid label{font-size:11px;color:var(--mute);display:block}
form.grid label.w2{grid-column:span 2}
form.grid label.w4{grid-column:1 / -1}
form.grid input,form.grid select{display:block;width:100%;margin-top:3px;border:1px solid var(--rule2);border-radius:6px;padding:0 8px;height:34px;background:var(--sf);color:var(--ink)}
form.grid .foot{grid-column:1 / -1;display:flex;gap:8px;align-items:center}
.denied{text-align:center;color:var(--mute);margin-top:60px}
.ws{font-size:11px;border-radius:3px;padding:1px 5px;background:#fde7c7;color:#8a5300}
.ws.done{background:var(--green);color:var(--greentx)}

/* ---------------------------------------------------------- application list */
.screen.list{align-items:stretch;padding:0;z-index:60;border-top:1px solid var(--rule)}
.listwrap{display:flex;flex-direction:column;width:100%;height:100%;background:var(--sf)}
.listbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.listbar h2{margin:0 12px 0 0;font-size:15px;color:var(--navy)}
.listbar input[type=search]{flex:0 1 420px;border:1px solid var(--rule2);border-radius:6px;padding:6px 9px}
.listbar select{border:1px solid var(--rule2);border-radius:6px;padding:6px 8px;background:var(--sf);max-width:230px}
.listbar .range{display:inline-flex;gap:4px}
.listbar .range input{width:118px;border:1px solid var(--rule2);border-radius:6px;padding:6px 8px}
.tbl.apps td.dim{color:var(--mute);font-size:11.5px;max-width:260px;white-space:normal}
.listscroll{flex:1;overflow:auto}
.tbl.apps th{position:sticky;top:0;z-index:1}
.tbl.apps td{vertical-align:top}
.tbl.apps td.wrap{max-width:360px;white-space:normal}
.tbl.apps td.mono{font-variant-numeric:tabular-nums;font-weight:600}
.tbl.apps .num,.tbl.apps th.num{text-align:right;white-space:nowrap}
.tbl.apps tr:hover td{background:var(--accent-w)}
.tbl.apps small{display:block;color:var(--mute);font-size:10.5px}
.listfoot{padding:12px;text-align:center}
.tbl.apps td.act{text-align:right;white-space:nowrap}
.tbl.apps .adm{display:flex;gap:4px;justify-content:flex-end;margin-top:5px}
.card .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px}
.card .grid label{margin:0}
.card .grid label.w2{grid-column:span 2}
.card .grid label.w4{grid-column:1 / -1}
.card .grid input{font-size:13px;padding:6px 8px}
.card .lead{white-space:pre-line}

/* ------------------------------------------------------------------ hints */
.tagh{display:inline-block;background:#e3f0ff;color:#174a8c;border:0;border-radius:3px;padding:1px 6px;
  font-size:10px;margin-left:6px;cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums;white-space:nowrap}
.tagh:hover{background:#cfe3ff}
.tagh.same{background:var(--green);color:var(--greentx)}
#hintPop{position:fixed;z-index:75;background:var(--sf);border:1px solid var(--rule2);border-radius:8px;
  box-shadow:0 10px 30px rgba(20,23,28,.14);width:440px;max-height:60vh;overflow:auto;font-size:12px}
#hintPop[hidden]{display:none}
.hp-head{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--rule);
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);position:sticky;top:0;background:var(--sf)}
.hp-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #f0f2f5}
.hp-row b{font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.hp-row.same{background:#f2faf5}
.hp-meta{color:var(--mute);font-size:11px;min-width:0}
.hp-meta em{font-style:normal;color:var(--good);font-weight:600}
.hp-meta small{display:block;font-size:10.5px}

/* ------------------------------------------------------------ application card */
.card.wide{max-width:720px;max-height:90vh;overflow:auto}
.card-head{display:flex;justify-content:space-between;align-items:center}
.card-head h2{margin:0}
.card h3{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;margin:12px 0 0;font-size:12.5px}
.kv dt{color:var(--mute)} .kv dd{margin:0;overflow-wrap:anywhere}
ul.files{list-style:none;margin:0;padding:0;font-size:12.5px}
ul.files li{padding:3px 0;border-bottom:1px solid #f0f2f5}
ul.files small{display:block;color:var(--mute);font-size:11px}
ul.files .mute{color:var(--mute)}
.card-foot{margin-top:16px;text-align:right}
.tbl.apps button.link.num{font-weight:600;padding:0;color:var(--accent)}
.screen#screen-card{z-index:65}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <b>Таблица сопоставления №2</b>
    <span>проверка и сбор рыночных цен ресурсов сметы</span>
  </div>
  <div class="wsbox" id="wsBox" hidden></div>
  <div class="grow"></div>
  <label class="btn cyan file" title="Добавить файлы смет .xlsx">
    <input type="file" id="pick" multiple accept=".xlsx,.xlsm">
    <span class="ic">＋</span> Файлы смет
  </label>
  <button class="btn" id="loadBook" title="Открыть сохранённую книгу цен (.json / .xlsx)">Книга цен</button>
  <button class="btn" id="saveBook" title="Сохранить введённые рыночные цены в файл">Сохранить цены</button>
  <label class="pickmode" title="Что попадает на листы проектов">
    <span>Листы:</span>
    <select id="reportMode">
      <option value="changed">Только изменённые цены (очищенные)</option>
      <option value="dedup">Все ресурсы (очищенные)</option>
      <option value="full">Полная копия (как фильтр + сортировка в Excel)</option>
    </select>
  </label>
  <button class="btn primary" id="export" disabled><span class="ic">↓</span> Скачать Excel</button>
  <div class="userbox" id="userBox" hidden></div>
</header>

<div class="ledger" id="ledger"></div>

<main id="main">
  <aside id="side">
    <div class="side-head">
      <span>Проекты</span>
      <button class="link" id="collapseAll" title="Свернуть список листов">–</button>
    </div>
    <div id="projects" class="projects"></div>
    <div class="drop-hint" id="dropHint">
      <b>Перетащите файлы сюда</b>
      <span>Каждый .xlsx = один проект. Листы улиц/объектов внутри находятся автоматически.</span>
    </div>
  </aside>

  <section id="work">
    <nav class="tabs">
      <button class="tab on" data-pane="prices">Проверка цен</button>
      <button class="tab" data-pane="sheet">Сводная таблица</button>
      <button class="tab" data-pane="report">Вид отчёта</button>
      <button class="tab" data-pane="settings">Настройки документа</button>
    </nav>

    <div class="pane on" id="pane-prices">
      <div class="toolbar">
        <input type="search" id="q" placeholder="Поиск по названию ресурса…" spellcheck="false">
        <select id="filter">
          <option value="all">Все</option>
          <option value="changed">Только изменённые</option>
          <option value="same">Без изменений</option>
          <option value="zero">С ценой 0</option>
          <option value="multi">Несколько сметных цен</option>
          <option value="hint">С подсказками</option>
        </select>
        <select id="sort">
          <option value="name">По названию</option>
          <option value="diff">По разнице (от большей к меньшей)</option>
          <option value="sum">По сметной сумме</option>
          <option value="count">По числу повторов</option>
        </select>
        <div class="grow"></div>
        <button class="btn sm" id="pctBtn">Применить %</button>
        <button class="btn sm" id="resetBtn">Сбросить выбранные</button>
        <span class="count" id="priceCount"></span>
      </div>
      <div class="thead" id="priceHead"></div>
      <div class="vscroll" id="priceScroll"><div class="vspace"><div class="vbody"></div></div></div>
    </div>

    <div class="pane" id="pane-sheet">
      <div class="toolbar">
        <input type="search" id="q2" placeholder="Поиск в сводной таблице…" spellcheck="false">
        <select id="jump"></select>
        <span class="count where" id="sheetWhere"></span>
        <div class="grow"></div>
        <span class="count" id="sheetCount"></span>
      </div>
      <div class="thead" id="sheetHead"></div>
      <div class="vscroll" id="sheetScroll"><div class="vspace"><div class="vbody"></div></div></div>
    </div>

    <div class="pane" id="pane-report">
      <div class="toolbar">
        <select id="reportProject"></select>
        <span class="count" id="modeHint"></span>
        <div class="grow"></div>
        <span class="count" id="reportCount"></span>
      </div>
      <div class="thead" id="reportHead"></div>
      <div class="vscroll" id="reportScroll"><div class="vspace"><div class="vbody"></div></div></div>
    </div>

    <div class="pane" id="pane-settings">
      <div class="form">
        <h3>Листы отчёта</h3>
        <label>Штамп в правом верхнем углу
          <textarea id="optStamp" rows="4"></textarea></label>
        <label>Заголовок документа
          <input id="optTitle" type="text"></label>
        <label>Стандартный текст примечания
          <input id="optNote" type="text"></label>
        <label class="row"><input type="checkbox" id="optAutoNote" checked>
          Ставить примечание в каждую изменённую строку автоматически</label>
        <label class="row"><input type="checkbox" id="optHideSums" checked>
          Скрывать столбцы сумм (для печати)</label>
        <label class="row"><input type="checkbox" id="optHideQty" checked>
          Скрывать столбец КОЛ-ВО</label>
        <label class="row"><input type="checkbox" id="optContents" checked>
          Добавлять лист «Оглавление» — номера строк «Лист1» для каждого проекта
          и улицы (столбец A: с – по)</label>
        <label>Порог розовой подсветки (условное форматирование)
          <input id="optCf" type="number" step="1000000" value="10000000"></label>
        <h3>Имя сводного листа</h3>
        <label><input id="optSheetName" type="text" value="Лист1"></label>
        <p class="note">Настройки сохраняются в браузере и восстанавливаются автоматически.</p>
      </div>
    </div>
  </section>
</main>


<div id="toast" class="toast"></div>
<div id="busy" class="busy"><div class="spin"></div><span id="busyText">Обработка…</span></div>

<input type="file" id="bookInput" accept=".json,.xlsx" hidden>

    this.prices_ui.status();
    this.prices_ui.list.refresh();
  }, 200);

  App.prototype.ledger = function () {
    var el = document.getElementById('ledger');
    var m = this.model;
    if (!m || !m.resources.length) {
      el.innerHTML = '<span class="empty">Добавьте файлы смет — можно перетащить .xlsx в окно.</span>';
      return;
    }
    // Both sides are summed row by row: a resource can carry several smeta
    // prices, and an untouched row keeps its own, so it must not be valued at
    // one representative price.
    var smeta = 0, market = 0, changed = 0;
    m.resources.forEach(function (r) {
      smeta += r.smetaSum;
      market += r.marketSum;
      if (!S.near(r.smetaSum, r.marketSum)) changed++;
    });
    var diff = smeta - market;
    var pct = smeta ? diff / smeta * 100 : 0;
    el.innerHTML =
      block('Проектов', m.spans.length) +
      block('Строк', S.money(m.rows.length)) +
      block('Ресурсов', S.money(m.resources.length) + ' · изменено ' + changed) +
      block('По смете', S.money(smeta) + ' сум') +
      block('По рынку', S.money(market) + ' сум') +
      block('Разница', S.money(diff) + ' сум  (' + pct.toFixed(2) + '%)', diff > 0 ? 'good' : diff < 0 ? 'bad' : '');
  };

  function block(k, v, cls) {
    return '<div><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
  }

  /* ------------------------------------------------------- sheet preview */

  // The continuous 1..N number that lives in column A of the assembled sheet —
  // the one that says which rows belong to which project.
  var IDX_COL = { w: 62, cls: 'num idx', h: 'A' };

  var SHEET_COLS = [
    { w: 58, cls: 'mid', h: '№' },
    { w: 0, h: 'НАИМЕНОВАНИЕ' },
    { w: 74, cls: 'mid', h: 'ЕД.ИЗМ.' },
    { w: 96, cls: 'num', h: 'КОЛ-ВО' },
    { w: 106, cls: 'num', h: 'Цена по смете' },
    { w: 128, cls: 'num', h: 'Сумма по смете' },
    { w: 106, cls: 'num', h: 'Рыночная цена' },
    { w: 128, cls: 'num', h: 'Рыночная сумма' },
    { w: 118, cls: 'num', h: 'Разница' }
  ];

  function w(c) { return c.w ? 'flex:0 0 ' + c.w + 'px' : 'flex:1 1 auto;min-width:240px'; }

  App.prototype.fillJump = function () {
    var sel = document.getElementById('jump');
    var opts = ['<option value="-1">Перейти к блоку…</option>'];
    var owner = this.rowOwner || [];
    (this.sheetRows || []).forEach(function (r, i) {
      if (r.kind !== 'title' && r.kind !== 'object') return;
      var t = r.cells[2] && r.cells[2].v;
      if (!t) return;
      var o = owner[r.r] || owner[r.r + 1];
      // A project line shows the project's whole range, a street line its own.
      var lo = r.kind === 'title' ? (o && o.p._from) : (o && o.from);
      var hi = r.kind === 'title' ? (o && o.p._to) : (o && o.to);
      var tail = lo ? '   [' + lo + '–' + hi + ']' : '';
      opts.push('<option value="' + i + '">' + (r.kind === 'title' ? '▸ ' : '\u00a0\u00a0\u00a0') +
        S.esc(String(t).slice(0, 58)) + tail + '</option>');
    });
    sel.innerHTML = opts.join('');
  };

  App.prototype.applySheetFilter = function () {
    var q = S.nameKey(document.getElementById('q2').value);
    if (!q) this.sheetView = this.sheetRows;
    else this.sheetView = this.sheetRows.filter(function (r) {
      return r.nm && S.nameKey(r.nm).indexOf(q) >= 0;
    });
    this.sheetList.setCount(this.sheetView.length);
    document.getElementById('sheetCount').textContent = this.sheetView.length + ' строк';
  };

  App.prototype.renderSheet = function (from, to) {
    if (!this._sheetHead) {
      document.getElementById('sheetHead').innerHTML = [IDX_COL].concat(SHEET_COLS).map(function (c) {
        return '<div class="c' + (c.cls ? ' ' + c.cls : '') + '" style="' + w(c) +
          '"' + (c === IDX_COL ? ' title="Столбец A «Лист1» — сквозной номер строки"' : '') + '>' +
          S.esc(c.h) + '</div>';
      }).join('');
      this._sheetHead = true;
    }
    var out = [], rows = this.sheetView || [];
    for (var i = from; i < to; i++) {
      var r = rows[i];
      if (!r) continue;
      out.push(rowHtml(r, r.cells, 2, 3, 4, 5, 6, 8, i, true, true));
    }
    this.showWhere(rows[from]);
    return out.join('');
  };

  /** Which project and street the top visible row belongs to. */
  App.prototype.showWhere = function (row) {
    var el = document.getElementById('sheetWhere');
    var o = row && this.rowOwner ? this.rowOwner[row.r] : null;
    el.innerHTML = o
      ? 'A' + row.r + ' · <b>' + S.esc(o.p.name) + '</b> ' + o.p._from + '–' + o.p._to +
        ' · ' + S.esc(o.name) + ' ' + o.from + '–' + o.to
      : '';
  };

  /**
   * Shared row renderer for both previews; column indexes differ per sheet.
   * `editable` puts a live input in the БОЗОР ЦЕНА cell — the same edit as on
   * the prices tab, so it lands on every row of that resource at once.
   */
  function rowHtml(r, cells, cNo, cName, cUnit, cQty, cPrice, cMarket, i, editable, showIndex) {
    var kind = r.kind || 'blank';
    var idx = showIndex
      ? '<div class="c num idx" style="' + w(IDX_COL) + '">' + (r.r || '') + '</div>' : '';
    if (kind !== 'item') {
      var label = '';
      for (var c = cNo; c <= cName + 1; c++) { if (cells[c] && cells[c].v != null) { label = String(cells[c].v); break; } }
      if (!label && cells[12] && cells[12].v != null) label = String(cells[12].v);
      return '<div class="vrow k-' + kind + '">' + idx + '<div class="c" style="flex:1 1 auto">' +
        S.esc(label.replace(/\n/g, ' ')) + '</div></div>';
    }
    var qty = r.qty || 0, sm = qty * r.price, mk = qty * r.market, d = sm - mk;
    var chg = !S.near(r.price, r.market);
    var no = cells[cNo] && cells[cNo].v;
    var market = editable && r.key
      ? '<div class="c num" style="' + w(SHEET_COLS[6]) + '">' +
        '<input class="pin' + (chg ? ' edited' : '') + '" data-key="' + S.esc(r.key) +
        '" data-focus="r' + r.r + '" data-i="' + i + '" inputmode="decimal" value="' +
        S.price(r.market) + '"></div>'
      : '<div class="c num" style="' + w(SHEET_COLS[6]) + '">' + S.price(r.market) + '</div>';
    return '<div class="vrow k-item' + (chg ? ' chg' : '') + '"' +
      (r.key ? ' data-key="' + S.esc(r.key) + '"' : '') + '>' + idx +
      '<div class="c mid" style="' + w(SHEET_COLS[0]) + '">' + (no == null ? '' : S.esc(no)) + '</div>' +
      '<div class="c" style="' + w(SHEET_COLS[1]) + '" title="' + S.esc(r.nm) + '">' + S.esc(r.nm) + '</div>' +
      '<div class="c mid" style="' + w(SHEET_COLS[2]) + '">' + S.esc(r.unit) + '</div>' +
      '<div class="c num" style="' + w(SHEET_COLS[3]) + '">' + S.qty(qty) + '</div>' +
      '<div class="c num" style="' + w(SHEET_COLS[4]) + '">' + S.price(r.price) + '</div>' +
      '<div class="c num" style="' + w(SHEET_COLS[5]) + '">' + S.money(sm) + '</div>' +
      market +
      '<div class="c num" style="' + w(SHEET_COLS[7]) + '">' + S.money(mk) + '</div>' +
      '<div class="c num' + (chg ? ' diff' : '') + '" style="' + w(SHEET_COLS[8]) + '">' + S.money(d) + '</div>' +
      '</div>';
  }

  function inVal(v) {
    if (v == null) return '';
    return Math.abs(v - Math.round(v)) < 1e-6 ? String(Math.round(v)) : String(Math.round(v * 1000) / 1000);
  }

  /* ------------------------------------------------------ report preview */

  App.prototype.fillReportProjects = function () {
    var sel = document.getElementById('reportProject');
    var cur = sel.value;
    sel.innerHTML = (this.model ? this.model.spans : []).map(function (s, i) {
      return '<option value="' + i + '">' + S.esc(s.project.name) + '</option>';
    }).join('');
    if (cur && sel.querySelector('option[value="' + cur + '"]')) sel.value = cur;
  };

  App.prototype.reportOpts = function () {
    return {
      mode: document.getElementById('reportMode').value,
      stamp: this.opts.stamp, docTitle: this.opts.docTitle, noteText: this.opts.noteText,
      autoNote: this.opts.autoNote, hideSums: this.opts.hideSums, hideQty: this.opts.hideQty,
      cfLimit: this.opts.cfLimit, sheetName: this.opts.sheetName,
      contents: this.opts.contents !== false
    };
  };

  function modeLabel() {
    var sel = document.getElementById('reportMode');
    return sel.options[sel.selectedIndex].text;
  }

  App.prototype.buildReportPreview = function () {
    document.getElementById('modeHint').textContent =
      'Режим: ' + modeLabel() + ' — меняется вверху, в файл Excel попадает то же';
    var i = +document.getElementById('reportProject').value;
    if (!this.model || !this.model.spans[i]) {
      this.reportRows = [];
      this.reportList.setCount(0);
      document.getElementById('reportCount').textContent = '';
      return;
    }
    var t0 = performance.now();
    var rep = S.report.build(this.model, this.model.spans[i], this.reportOpts());
    this.reportRows = rep.rows;
    this.reportList.setCount(rep.rows.length);
    var items = rep.rows.filter(function (r) { return r.kind === 'item'; }).length;
    document.getElementById('reportCount').textContent =
      rep.rows.length + ' строк · ' + items + ' ресурсов · ' + Math.round(performance.now() - t0) + ' мс';
  };

  App.prototype.renderReport = function (from, to) {
    if (!this._repHead) {
      document.getElementById('reportHead').innerHTML = SHEET_COLS.map(function (c) {
        return '<div class="c' + (c.cls ? ' ' + c.cls : '') + '" style="' + w(c) + '">' + S.esc(c.h) + '</div>';
      }).join('');
      this._repHead = true;
    }
    var out = [], rows = this.reportRows || [];
    for (var i = from; i < to; i++) {
      var r = rows[i];
      if (!r) continue;
      out.push(rowHtml(r, r.cells, 2, 4, 5, 6, 7, 9, i, false, false));
    }
    return out.join('');
  };

  /* ------------------------------------------------------------- exports */

  App.prototype.exportWorkbook = function () {
    if (!this.model) return;
    var self = this;
    this.busy(true, 'Подготовка файла Excel…');
    setTimeout(function () {
      try {
        var t0 = performance.now();
        var bytes = S.buildWorkbook(self.model, self.reportOpts());
        download(bytes, fileName(self));
        self.toast('Файл готов · ' + modeLabel() + ' · ' +
          (bytes.length / 1024 / 1024).toFixed(1) + ' MB · ' + Math.round(performance.now() - t0) + ' ms');
      } catch (e) {
        self.toast('Ошибка экспорта: ' + (e.message || e), true);
      } finally {
        self.busy(false);
      }
    }, 30);
  };

  function fileName(app) {
    var d = new Date();
    var p = String(d.getFullYear()) + pad(d.getMonth() + 1) + pad(d.getDate());
    var base = app.projects.length === 1 ? app.projects[0].name : 'Taqqoslash';
    return base.replace(/[^\wЀ-ӿ\- ]+/g, '') + '_taqqoslash_' + p + '.xlsx';
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function download(bytes, name) {
    var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  App.prototype.savePriceBook = function () {
    if (!this.model) { this.toast('Сначала добавьте файлы смет', true); return; }
    var self = this;
    var book = this.model.resources
      .filter(function (r) { return !S.near(r.price, r.market); })
      .map(function (r) {
        // `smeta` identifies which priced line this belongs to when reloaded.
        return { name: r.name, unit: r.unit, price: r.market, smeta: r.price, note: self.opts.noteText };
      });
    if (!book.length) { this.toast('Ни одна цена ещё не изменена', true); return; }
    var blob = new Blob([JSON.stringify(book, null, 1)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'narx_kitobi.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    this.toast('Сохранено цен: ' + book.length);
  };

  App.prototype.loadPriceBook = function (file) {
    var self = this;
    var reader = new FileReader();
    var isJson = /\.json$/i.test(file.name);
    reader.onload = function () {
      var entries;
      try {
        entries = isJson ? JSON.parse(reader.result) : bookFromXlsx(new Uint8Array(reader.result));
      } catch (e) {
        self.toast('Не удалось прочитать книгу цен: ' + (e.message || e), true);
        return;
      }
      if (!Array.isArray(entries)) { self.toast('Книга цен должна быть списком', true); return; }
      // An entry that records the smeta price it was taken from lands on exactly
      // that line; an older book without one is applied to every priced variant
      // of the name.
      var exact = {}, loose = {}, n = 0;
      entries.forEach(function (e) {
        var p = S.num(e.price != null ? e.price : e.market);
        if (!e.name || p == null) return;
        var sm = S.num(e.smeta);
        if (sm != null) exact[S.resKey(e.name, e.unit || '', sm)] = p;
        else loose[S.nameUnitKey(e.name, e.unit || '')] = p;
        n++;
      });
      self.prices = Object.assign(self.prices, exact);
      self.looseBook = Object.assign(self.looseBook || {}, loose);
      self.spreadLooseBook();
      if (self.model) S.applyPrices(self.model, self.prices);
      self.prices_ui.apply();
      self.ledger();
      self.sheetList.refresh();
      self.toast('Загружено цен: ' + n);
    };
    if (isJson) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  };

  /** Accept a plain price list as a spreadsheet too: name / unit / price columns. */
  function bookFromXlsx(bytes) {
    var wb = S.readXlsx(bytes);
    for (var s = 0; s < wb.sheets.length; s++) {
      var rows = wb.sheets[s].rows;
      var hdr = -1, cName = 0, cUnit = 0, cPrice = 0;
      for (var r = 1; r < Math.min(rows.length, 30) && hdr < 0; r++) {
        var cells = rows[r] || [];
        for (var c = 1; c < cells.length; c++) {
          var t = S.nameKey(cells[c] && cells[c].v);
          if (!t) continue;
          if (/NAME|НАИМЕН|NOM/.test(t)) cName = c;
          else if (/UNIT|ЕД|BIRLIK/.test(t)) cUnit = c;
          else if (/PRICE|ЦЕНА|NARX/.test(t)) cPrice = c;
        }
        if (cName && cPrice) hdr = r;
      }
      if (hdr < 0) continue;
      var out = [];
      for (var i = hdr + 1; i < rows.length; i++) {
        var row = rows[i];
        if (!row) continue;
        var nm = row[cName] && row[cName].v;
        var pr = S.num(row[cPrice] && row[cPrice].v);
        if (!nm || pr == null) continue;
        out.push({ name: String(nm), unit: cUnit && row[cUnit] ? String(row[cUnit].v || '') : '', price: pr });
      }
      if (out.length) return out;
    }
    throw new Error('столбцы цен не найдены');
  }

  document.addEventListener('DOMContentLoaded', function () { window.app = new App(); });
  if (document.readyState !== 'loading' && !window.app) window.app = new App();

  S.App = App;
})(S);
</script>
</body>
</html>
