<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смета — Таблица сопоставления №2</title>
<style>/*__CSS__*/</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <b>Таблица сопоставления №2</b>
    <span>проверка и сбор рыночных цен ресурсов сметы</span>
  </div>
  <div class="wsbox" id="wsBox" hidden></div>
  <div class="grow"></div>
  <label class="btn cyan file" title="Добавить файлы смет .xlsx">
    <input type="file" id="pick" multiple accept=".xlsx,.xlsm">
    <span class="ic">＋</span> Файлы смет
  </label>
  <button class="btn" id="loadBook" title="Открыть сохранённую книгу цен (.json / .xlsx)">Книга цен</button>
  <button class="btn" id="saveBook" title="Сохранить введённые рыночные цены в файл">Сохранить цены</button>
  <label class="pickmode" title="Что попадает на листы проектов">
    <span>Листы:</span>
    <select id="reportMode">
      <option value="changed">Только изменённые цены (очищенные)</option>
      <option value="dedup">Все ресурсы (очищенные)</option>
      <option value="full">Полная копия (как фильтр + сортировка в Excel)</option>
    </select>
  </label>
  <button class="btn primary" id="export" disabled><span class="ic">↓</span> Скачать Excel</button>
  <div class="userbox" id="userBox" hidden></div>
</header>

<div class="ledger" id="ledger"></div>

<main id="main">
  <aside id="side">
    <div class="side-head">
      <span>Проекты</span>
      <button class="link" id="collapseAll" title="Свернуть список листов">–</button>
    </div>
    <div id="projects" class="projects"></div>
    <div class="drop-hint" id="dropHint">
      <b>Перетащите файлы сюда</b>
      <span>Каждый .xlsx = один проект. Листы улиц/объектов внутри находятся автоматически.</span>
    </div>
  </aside>

  <section id="work">
    <nav class="tabs">
      <button class="tab on" data-pane="prices">Проверка цен</button>
      <button class="tab" data-pane="sheet">Сводная таблица</button>
      <button class="tab" data-pane="report">Вид отчёта</button>
      <button class="tab" data-pane="settings">Настройки документа</button>
    </nav>

    <div class="pane on" id="pane-prices">
      <div class="toolbar">
        <input type="search" id="q" placeholder="Поиск по названию ресурса…" spellcheck="false">
        <select id="filter">
          <option value="all">Все</option>
          <option value="changed">Только изменённые</option>
          <option value="same">Без изменений</option>
          <option value="zero">С ценой 0</option>
          <option value="multi">Несколько сметных цен</option>
          <option value="hint">С подсказками</option>
        </select>
        <select id="sort">
          <option value="name">По названию</option>
          <option value="diff">По разнице (от большей к меньшей)</option>
          <option value="sum">По сметной сумме</option>
          <option value="count">По числу повторов</option>
        </select>
        <div class="grow"></div>
        <button class="btn sm" id="pctBtn">Применить %</button>
        <button class="btn sm" id="resetBtn">Сбросить выбранные</button>
        <span class="count" id="priceCount"></span>
      </div>
      <div class="thead" id="priceHead"></div>
      <div class="vscroll" id="priceScroll"><div class="vspace"><div class="vbody"></div></div></div>
    </div>

    <div class="pane" id="pane-sheet">
      <div class="toolbar">
        <input type="search" id="q2" placeholder="Поиск в сводной таблице…" spellcheck="false">
        <select id="jump"></select>
        <span class="count where" id="sheetWhere"></span>
        <div class="grow"></div>
        <span class="count" id="sheetCount"></span>
      </div>
      <div class="thead" id="sheetHead"></div>
      <div class="vscroll" id="sheetScroll"><div class="vspace"><div class="vbody"></div></div></div>
    </div>

    <div class="pane" id="pane-report">
      <div class="toolbar">
        <select id="reportProject"></select>
        <span class="count" id="modeHint"></span>
        <div class="grow"></div>
        <span class="count" id="reportCount"></span>
      </div>
      <div class="thead" id="reportHead"></div>
      <div class="vscroll" id="reportScroll"><div class="vspace"><div class="vbody"></div></div></div>
    </div>

    <div class="pane" id="pane-settings">
      <div class="form">
        <h3>Листы отчёта</h3>
        <label>Штамп в правом верхнем углу
          <textarea id="optStamp" rows="4"></textarea></label>
        <label>Заголовок документа
          <input id="optTitle" type="text"></label>
        <label>Стандартный текст примечания
          <input id="optNote" type="text"></label>
        <label class="row"><input type="checkbox" id="optAutoNote" checked>
          Ставить примечание в каждую изменённую строку автоматически</label>
        <label class="row"><input type="checkbox" id="optHideSums" checked>
          Скрывать столбцы сумм (для печати)</label>
        <label class="row"><input type="checkbox" id="optHideQty" checked>
          Скрывать столбец КОЛ-ВО</label>
        <label class="row"><input type="checkbox" id="optContents" checked>
          Добавлять лист «Оглавление» — номера строк «Лист1» для каждого проекта
          и улицы (столбец A: с – по)</label>
        <label>Порог розовой подсветки (условное форматирование)
          <input id="optCf" type="number" step="1000000" value="10000000"></label>
        <h3>Имя сводного листа</h3>
        <label><input id="optSheetName" type="text" value="Лист1"></label>
        <p class="note">Настройки сохраняются в браузере и восстанавливаются автоматически.</p>
      </div>
    </div>
  </section>
</main>

<!--__SCREENS__-->
<div id="toast" class="toast"></div>
<div id="busy" class="busy"><div class="spin"></div><span id="busyText">Обработка…</span></div>

<input type="file" id="bookInput" accept=".json,.xlsx" hidden>

<script>window.__WORKER_SRC__ = /*__WORKER__*/;</script>
<script>/*__JS__*/</script>
</body>
</html>
